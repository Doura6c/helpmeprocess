<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page introuvable (404) | Help'me Process</title>
  <meta name="robots" content="noindex, follow"/>
  <meta name="theme-color" content="#002C6E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#002C6E,#001A4A);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;-webkit-font-smoothing:antialiased}
    .box{max-width:520px}
    .code{font-size:clamp(5rem,18vw,9rem);font-weight:900;line-height:1;letter-spacing:-.04em;background:linear-gradient(135deg,#fff,#E85D20);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    h1{font-size:clamp(1.3rem,4vw,1.8rem);font-weight:800;margin:12px 0 10px}
    p{color:rgba(255,255,255,.7);font-size:.95rem;line-height:1.7;margin-bottom:28px}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    a{text-decoration:none;font-weight:700;font-size:.92rem;padding:13px 24px;border-radius:10px;transition:transform .2s,box-shadow .2s}
    .btn-primary{background:#E85D20;color:#fff;box-shadow:0 4px 16px rgba(232,93,32,.4)}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,93,32,.5)}
    .btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}
    .btn-ghost:hover{background:rgba(255,255,255,.18)}
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Cette page a raccroché.</h1>
    <p>La page que vous cherchez n'existe pas ou a été déplacée. Pas d'inquiétude — notre équipe, elle, répond toujours.</p>
    <div class="actions">
      <a href="index.html" class="btn-primary">Retour à l'accueil →</a>
      <a href="index.html#contact" class="btn-ghost">Nous contacter</a>
    </div>
  </div>
  <script src="/back-to-top.js" defer></script>
</body>
</html>
